[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fixture-pkg"
version = "0.1.0"
description = "Planted-bug fixture repo for gauntlet acceptance testing"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]

[tool.hatch.build.targets.wheel]
packages = ["src/fixture_pkg"]
